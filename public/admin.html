<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FILE HUB - Admin Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #0b0f19; color: #e2e8f0; font-family: system-ui, -apple-system, sans-serif; }
        .glass-card { background: rgba(17, 24, 39, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .neon-border { border-color: rgba(168, 85, 247, 0.4); box-shadow: 0 0 15px rgba(168, 85, 247, 0.15); }
    </style>
</head>
<body class="min-h-screen p-4 max-w-2xl mx-auto pb-12">

    <div class="flex items-center justify-between my-6">
        <div class="flex items-center space-x-2">
            <div class="w-8 h-8 bg-purple-600/20 border border-purple-500/40 rounded-lg flex items-center justify-center text-purple-400">
                <i class="fa-solid fa-sliders"></i>
            </div>
            <h1 class="text-lg font-bold text-purple-300">ระบบจัดการแจกไฟล์</h1>
        </div>
        <a href="/" class="text-xs text-slate-400 hover:text-white bg-slate-800 px-3 py-1.5 rounded-lg border border-slate-700 transition">
            <i class="fa-solid fa-arrow-left mr-1"></i> หน้าหลัก
        </a>
    </div>

    <!-- ฟอร์มเพิ่มไฟล์ -->
    <div class="glass-card neon-border rounded-2xl p-5 mb-6 border">
        <h2 class="text-xs font-bold text-purple-400 mb-3 uppercase tracking-wider flex items-center gap-1.5">
            <i class="fa-solid fa-file-circle-plus"></i> เพิ่มไฟล์ใหม่เข้าสู่ระบบ
        </h2>
        <div class="space-y-3">
            <div>
                <label class="block text-[11px] text-slate-400 mb-1">รหัสผ่าน Admin *</label>
                <input type="password" id="adminPass" placeholder="กรอกรหัสผ่าน Admin" class="w-full bg-slate-900 border border-slate-700/80 rounded-xl px-3.5 py-2 text-xs text-white focus:outline-none focus:border-purple-500">
            </div>
            <div>
                <label class="block text-[11px] text-slate-400 mb-1">ชื่อไฟล์ / หัวข้อ *</label>
                <input type="text" id="fileTitle" placeholder="เช่น DJ Loop Kit Vol.1 หรือ โปรแกรม X" class="w-full bg-slate-900 border border-slate-700/80 rounded-xl px-3.5 py-2 text-xs text-white focus:outline-none focus:border-purple-500">
            </div>
            <div>
                <label class="block text-[11px] text-slate-400 mb-1">หมวดหมู่</label>
                <input type="text" id="fileCategory" placeholder="เช่น Sound Loop, Music, Software, Mod" class="w-full bg-slate-900 border border-slate-700/80 rounded-xl px-3.5 py-2 text-xs text-white focus:outline-none focus:border-purple-500">
            </div>
            <div>
                <label class="block text-[11px] text-slate-400 mb-1">ลิงก์ดาวน์โหลด (Google Drive / Mega / MediaFire) *</label>
                <input type="text" id="fileDownload" placeholder="https://drive.google.com/..." class="w-full bg-slate-900 border border-slate-700/80 rounded-xl px-3.5 py-2 text-xs text-white focus:outline-none focus:border-purple-500">
            </div>
            <div>
                <label class="block text-[11px] text-slate-400 mb-1">ลิงก์ตัวอย่างเสียง (.mp3 - ถ้ามี)</label>
                <input type="text" id="fileAudio" placeholder="https://.../sample.mp3" class="w-full bg-slate-900 border border-slate-700/80 rounded-xl px-3.5 py-2 text-xs text-white focus:outline-none focus:border-purple-500">
            </div>
            <button type="button" onclick="submitFile()" id="submitBtn" class="w-full bg-purple-600 hover:bg-purple-500 text-white font-bold py-2.5 rounded-xl text-xs transition mt-2 active:scale-95">
                บันทึกไฟล์เข้าระบบ
            </button>
        </div>
    </div>

    <!-- รายการจัดการ -->
    <h2 class="text-xs font-bold text-slate-400 mb-3 uppercase tracking-wider flex items-center gap-1.5">
        <i class="fa-solid fa-list-check"></i> จัดการรายการไฟล์ในระบบ
    </h2>
    <div id="adminFileList" class="space-y-3">
        <div class="text-center py-8 text-slate-500 text-xs glass-card rounded-xl">กำลังโหลด...</div>
    </div>

    <script>
        async function loadAdminFiles() {
            const listEl = document.getElementById('adminFileList');
            try {
                const res = await fetch('/api/files');
                
                // ตรวจสอบ Content-Type ก่อน parse
                const contentType = res.headers.get("content-type");
                let files;
                if (contentType && contentType.includes("application/json")) {
                    files = await res.json();
                } else {
                    listEl.innerHTML = `<div class="text-center py-6 text-red-400 text-xs glass-card rounded-xl">ยังไม่ได้ตั้งค่า API Server (` + res.status + `)</div>`;
                    return;
                }

                if (!files || files.length === 0) {
                    listEl.innerHTML = `<div class="text-center py-6 text-slate-500 text-xs glass-card rounded-xl">ยังไม่มีไฟล์ในระบบ</div>`;
                    return;
                }
                listEl.innerHTML = files.map(file => `
                    <div class="glass-card rounded-xl p-3 flex items-center justify-between gap-3 border border-slate-800">
                        <div class="overflow-hidden">
                            <span class="text-[9px] font-bold text-purple-400 bg-purple-500/10 px-2 py-0.5 rounded-full border border-purple-500/20">${escapeHtml(file.category || 'General')}</span>
                            <h3 class="font-semibold text-xs text-slate-200 mt-1 truncate">${escapeHtml(file.title)}</h3>
                        </div>
                        <button onclick="deleteFile('${file.id}')" class="bg-red-500/10 hover:bg-red-500/20 text-red-400 text-xs px-3 py-1.5 rounded-lg border border-red-500/30 transition shrink-0">
                            <i class="fa-solid fa-trash mr-1"></i> ลบ
                        </button>
                    </div>
                `).join('');
            } catch (err) {
                listEl.innerHTML = `<div class="text-center py-6 text-red-400 text-xs glass-card rounded-xl">โหลดรายการไม่สำเร็จ</div>`;
            }
        }

        async function submitFile() {
            const pass = document.getElementById('adminPass').value;
            const title = document.getElementById('fileTitle').value;
            const downloadUrl = document.getElementById('fileDownload').value;

            if (!pass || !title || !downloadUrl) {
                alert('กรุณากรอก รหัสผ่าน, ชื่อไฟล์ และ ลิงก์ดาวน์โหลด ให้ครบถ้วน');
                return;
            }

            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerText = 'กำลังบันทึก...';

            const payload = {
                password: pass,
                title: title,
                category: document.getElementById('fileCategory').value,
                downloadUrl: downloadUrl,
                audioUrl: document.getElementById('fileAudio').value
            };

            try {
                const res = await fetch('/api/files', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                // ดักจับรูปแบบข้อมูลที่ตอบกลับมาจาก Server
                const contentType = res.headers.get("content-type");
                let data;
                if (contentType && contentType.includes("application/json")) {
                    data = await res.json();
                } else {
                    const textErr = await res.text();
                    throw new Error(`ข้อผิดพลาดจาก Server (${res.status}): โปรดตรวจสอบการสร้างไฟล์ /api/files.js`);
                }

                if (!res.ok) throw new Error(data.error || 'เกิดข้อผิดพลาดในการบันทึกข้อมูล');

                alert('เพิ่มไฟล์สำเร็จ!');
                document.getElementById('fileTitle').value = '';
                document.getElementById('fileCategory').value = '';
                document.getElementById('fileDownload').value = '';
                document.getElementById('fileAudio').value = '';
                loadAdminFiles();
            } catch (err) {
                alert(err.message);
            } finally {
                btn.disabled = false;
                btn.innerText = 'บันทึกไฟล์เข้าระบบ';
            }
        }

        async function deleteFile(id) {
            const pass = prompt('กรุณากรอกรหัสผ่าน Admin เพื่อยืนยันการลบ:');
            if (!pass) return;

            try {
                const res = await fetch('/api/files', {
                    method: 'DELETE',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id, password: pass })
                });

                const contentType = res.headers.get("content-type");
                let data;
                if (contentType && contentType.includes("application/json")) {
                    data = await res.json();
                } else {
                    throw new Error('Server ไม่ตอบกลับในรูปแบบ JSON');
                }

                if (!res.ok) throw new Error(data.error || 'รหัสผ่านไม่ถูกต้อง');

                alert('ลบรายการเรียบร้อย');
                loadAdminFiles();
            } catch (err) {
                alert(err.message);
            }
        }

        function escapeHtml(str) { return (str || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
        loadAdminFiles();
    </script>
</body>
</html>
