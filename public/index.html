<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FILE-NEXUS - Digital Content & Remix Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #0b0f19; color: #e2e8f0; font-family: system-ui, -apple-system, sans-serif; }
        .glass-card { background: rgba(17, 24, 39, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
    </style>
</head>
<body class="min-h-screen pb-16">

    <!-- Header Bar -->
    <header class="glass-card sticky top-0 z-40 border-b border-slate-800 py-3 px-4 mb-6">
        <div class="max-w-3xl mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-2.5">
                <div class="w-9 h-9 bg-purple-600/20 border border-purple-500/40 rounded-xl flex items-center justify-center text-purple-400 shadow-lg shadow-purple-500/20">
                    <i class="fa-solid fa-network-wired animate-pulse"></i>
                </div>
                <div>
                    <h1 class="font-bold text-base tracking-wider text-white">FILE<span class="text-purple-400">-NEXUS</span></h1>
                    <p class="text-[10px] text-slate-400">rosantoscs1997.com</p>
                </div>
            </div>
            <!-- ปุ่มลิงก์ข้ามไปหน้า admin.html -->
            <a href="/admin.html" class="text-xs bg-slate-800 hover:bg-slate-700 text-purple-300 border border-purple-500/30 px-3 py-1.5 rounded-lg transition flex items-center gap-1.5">
                <i class="fa-solid fa-lock text-[10px]"></i> หลังบ้าน (Admin)
            </a>
        </div>
    </header>

    <main class="max-w-3xl mx-auto px-4">
        <!-- Search Bar -->
        <div class="glass-card p-3.5 rounded-2xl mb-6 flex flex-col sm:flex-row gap-3 justify-between items-center">
            <div class="relative w-full">
                <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3 text-slate-500 text-xs"></i>
                <input type="text" id="searchInput" onkeyup="filterFiles()" placeholder="ค้นหาชื่อไฟล์ / เพลง / หมวดหมู่..." class="w-full bg-slate-900/80 border border-slate-700/60 rounded-xl pl-9 pr-4 py-2 text-xs text-slate-200 focus:outline-none focus:border-purple-500">
            </div>
            <div id="fileCount" class="text-[11px] text-slate-400 whitespace-nowrap px-2">กำลังโหลด...</div>
        </div>

        <!-- File List Container -->
        <div id="fileList" class="space-y-3">
            <div class="text-center py-12 glass-card rounded-2xl">
                <i class="fa-solid fa-spinner fa-spin text-2xl text-purple-400 mb-2"></i>
                <p class="text-slate-400 text-xs">กำลังเชื่อมต่อฐานข้อมูล FILE-NEXUS...</p>
            </div>
        </div>
    </main>

    <script>
        let allFiles = [];

        async function loadFiles() {
            const listEl = document.getElementById('fileList');
            const countEl = document.getElementById('fileCount');

            try {
                const res = await fetch('/api/files');
                if (!res.ok) throw new Error();
                allFiles = await res.json();
                
                countEl.innerText = `รวมทั้งหมด ${allFiles.length} รายการ`;
                renderFiles(allFiles);
            } catch (err) {
                listEl.innerHTML = `
                    <div class="glass-card rounded-2xl p-6 text-center border-purple-500/30">
                        <i class="fa-solid fa-circle-check text-purple-400 text-3xl mb-2"></i>
                        <p class="text-white text-xs font-semibold">ระบบ FILE-NEXUS พร้อมใช้งานแล้ว!</p>
                    </div>`;
                countEl.innerText = `พร้อมใช้งาน`;
            }
        }

        function renderFiles(files) {
            const listEl = document.getElementById('fileList');
            if (!files || files.length === 0) {
                listEl.innerHTML = `<div class="text-center py-10 text-slate-500 text-xs glass-card rounded-2xl">ยังไม่มีรายการไฟล์ในระบบ FILE-NEXUS</div>`;
                return;
            }

            listEl.innerHTML = files.map(file => `
                <div class="glass-card rounded-2xl p-4 transition hover:border-slate-700 flex flex-col gap-3">
                    <div class="flex items-start justify-between gap-3">
                        <div>
                            <span class="text-[10px] font-bold text-purple-400 bg-purple-500/10 px-2.5 py-0.5 rounded-full border border-purple-500/20">${escapeHtml(file.category || 'General')}</span>
                            <h3 class="font-semibold text-sm text-slate-100 mt-1.5">${escapeHtml(file.title)}</h3>
                        </div>
                        <a href="${escapeHtml(file.downloadUrl)}" target="_blank" class="bg-purple-600 hover:bg-purple-500 text-white text-xs font-semibold px-3.5 py-2 rounded-xl transition flex items-center gap-1.5 shrink-0">
                            <i class="fa-solid fa-download"></i> โหลด
                        </a>
                    </div>
                    ${file.audioUrl ? `
                        <audio controls class="w-full h-8 rounded-lg bg-slate-900/90 border border-slate-800">
                            <source src="${escapeHtml(file.audioUrl)}" type="audio/mpeg">
                        </audio>
                    ` : ''}
                </div>
            `).join('');
        }

        function filterFiles() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allFiles.filter(f => 
                (f.title && f.title.toLowerCase().includes(query)) || 
                (f.category && f.category.toLowerCase().includes(query))
            );
            renderFiles(filtered);
        }

        function escapeHtml(str) { return (str || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }

        loadFiles();
    </script>
</body>
</html>
