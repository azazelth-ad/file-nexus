<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FILE-NEXUS - Digital Content & Remix Hub</title>
    <!-- Tailwind CSS & FontAwesome -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #0b0f19; color: #e2e8f0; font-family: system-ui, -apple-system, sans-serif; }
        .glass-card { background: rgba(17, 24, 39, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .neon-border { border-color: rgba(168, 85, 247, 0.4); box-shadow: 0 0 15px rgba(168, 85, 247, 0.15); }
    </style>
</head>
<body class="min-h-screen pb-16">

    <!-- Header Bar -->
    <header class="glass-card sticky top-0 z-40 border-b border-slate-800 py-3 px-4 mb-6">
        <div class="max-w-3xl mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-2.5">
                <div class="w-9 h-9 bg-purple-600/20 border border-purple-500/40 rounded-xl flex items-center justify-center text-purple-400 shadow-lg shadow-purple-500/20">
                    <i class="fa-solid fa-network-wired animate-pulse"></i>
                </div>
                <div>
                    <h1 class="font-bold text-base tracking-wider text-white">FILE<span class="text-purple-400">-NEXUS</span></h1>
                    <p class="text-[10px] text-slate-400">rosantoscs1997.com</p>
                </div>
            </div>
            <!-- ปุ่มกดเปิด Admin Modal -->
            <button onclick="openAdminModal()" class="text-xs bg-slate-800 hover:bg-slate-700 text-purple-300 border border-purple-500/30 px-3 py-1.5 rounded-lg transition flex items-center gap-1.5">
                <i class="fa-solid fa-lock text-[10px]"></i> หลังบ้าน (Admin)
            </button>
        </div>
    </header>

    <main class="max-w-3xl mx-auto px-4">
        <!-- Search Bar & Counter -->
        <div class="glass-card p-3.5 rounded-2xl mb-6 flex flex-col sm:flex-row gap-3 justify-between items-center">
            <div class="relative w-full">
                <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3 text-slate-500 text-xs"></i>
                <input type="text" id="searchInput" onkeyup="filterFiles()" placeholder="ค้นหาชื่อไฟล์ / เพลง / หมวดหมู่..." class="w-full bg-slate-900/80 border border-slate-700/60 rounded-xl pl-9 pr-4 py-2 text-xs text-slate-200 focus:outline-none focus:border-purple-500">
            </div>
            <div id="fileCount" class="text-[11px] text-slate-400 whitespace-nowrap px-2">
                กำลังโหลด...
            </div>
        </div>

        <!-- File List Container -->
        <div id="fileList" class="space-y-3">
            <div class="text-center py-12 glass-card rounded-2xl">
                <i class="fa-solid fa-spinner fa-spin text-2xl text-purple-400 mb-2"></i>
                <p class="text-slate-400 text-xs">กำลังเชื่อมต่อฐานข้อมูล FILE-NEXUS...</p>
            </div>
        </div>
    </main>

    <!-- Admin Panel (Modal Pop-up) -->
    <div id="adminModal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex items-center justify-center hidden p-4">
        <div class="glass-card neon-border max-w-md w-full rounded-2xl p-5 relative border">
            <button onclick="closeAdminModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-base"></i></button>
            
            <h2 class="text-sm font-bold text-purple-300 mb-4 flex items-center gap-2">
                <i class="fa-solid fa-sliders"></i> จัดการระบบ FILE-NEXUS (Admin)
            </h2>

            <form id="adminForm" onsubmit="handleFormSubmit(event)" class="space-y-3">
                <div>
                    <label class="block text-[11px] text-slate-400 mb-1">รหัสผ่าน Admin *</label>
                    <input type="password" id="adminPass" required placeholder="กรอกรหัสผ่าน (เช่น 1234)" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-purple-500">
                </div>
                <div>
                    <label class="block text-[11px] text-slate-400 mb-1">ชื่อไฟล์ / ชื่อเพลง *</label>
                    <input type="text" id="fileTitle" required placeholder="เช่น Nonstop Remix Vol.1" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-purple-500">
                </div>
                <div>
                    <label class="block text-[11px] text-slate-400 mb-1">หมวดหมู่</label>
                    <input type="text" id="fileCategory" placeholder="เช่น Remix, Sound Loop, Mod" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-purple-500">
                </div>
                <div>
                    <label class="block text-[11px] text-slate-400 mb-1">ลิงก์ดาวน์โหลด (Google Drive / Mega) *</label>
                    <input type="url" id="fileDownload" required placeholder="https://drive.google.com/..." class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-purple-500">
                </div>
                <div>
                    <label class="block text-[11px] text-slate-400 mb-1">ลิงก์ไฟล์เสียงตัวอย่าง (.mp3 - ถ้ามี)</label>
                    <input type="url" id="fileAudio" placeholder="https://.../sample.mp3" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-purple-500">
                </div>
                
                <button type="submit" id="saveBtn" class="w-full bg-purple-600 hover:bg-purple-500 text-white font-bold py-2.5 rounded-xl text-xs transition mt-2">
                    บันทึกข้อมูลเข้า FILE-NEXUS
                </button>
            </form>
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        let allFiles = [];

        async function loadFiles() {
            const listEl = document.getElementById('fileList');
            const countEl = document.getElementById('fileCount');

            try {
                const res = await fetch('/api/files');
                if (!res.ok) throw new Error();
                allFiles = await res.json();
                
                countEl.innerText = `รวมทั้งหมด ${allFiles.length} รายการ`;
                renderFiles(allFiles);
            } catch (err) {
                listEl.innerHTML = `
                    <div class="glass-card rounded-2xl p-6 text-center border-purple-500/30">
                        <i class="fa-solid fa-circle-check text-purple-400 text-3xl mb-2"></i>
                        <p class="text-white text-xs font-semibold">ระบบ FILE-NEXUS พร้อมใช้งานแล้ว!</p>
                        <p class="text-[11px] text-slate-400 mt-1">กดปุ่ม "หลังบ้าน (Admin)" มุมขวาบน เพื่อเพิ่มไฟล์รายการแรกได้เลยครับ</p>
                    </div>`;
                countEl.innerText = `พร้อมใช้งาน`;
            }
        }

        function renderFiles(files) {
            const listEl = document.getElementById('fileList');
            if (!files || files.length === 0) {
                listEl.innerHTML = `<div class="text-center py-10 text-slate-500 text-xs glass-card rounded-2xl">ยังไม่มีรายการไฟล์ในระบบ FILE-NEXUS</div>`;
                return;
            }

            listEl.innerHTML = files.map(file => `
                <div class="glass-card rounded-2xl p-4 transition hover:border-slate-700 flex flex-col gap-3">
                    <div class="flex items-start justify-between gap-3">
                        <div>
                            <span class="text-[10px] font-bold text-purple-400 bg-purple-500/10 px-2.5 py-0.5 rounded-full border border-purple-500/20">${escapeHtml(file.category || 'General')}</span>
                            <h3 class="font-semibold text-sm text-slate-100 mt-1.5">${escapeHtml(file.title)}</h3>
                        </div>
                        <div class="flex items-center gap-2">
                            <button onclick="deleteFile('${file.id}')" class="text-slate-500 hover:text-red-400 text-xs p-1.5 transition" title="ลบรายการ">
                                <i class="fa-solid fa-trash"></i>
                            </button>
                            <a href="${escapeHtml(file.downloadUrl)}" target="_blank" class="bg-purple-600 hover:bg-purple-500 text-white text-xs font-semibold px-3.5 py-2 rounded-xl transition flex items-center gap-1.5">
                                <i class="fa-solid fa-download"></i> โหลด
                            </a>
                        </div>
                    </div>
                    ${file.audioUrl ? `
                        <audio controls class="w-full h-8 rounded-lg bg-slate-900/90 border border-slate-800">
                            <source src="${escapeHtml(file.audioUrl)}" type="audio/mpeg">
                        </audio>
                    ` : ''}
                </div>
            `).join('');
        }

        function filterFiles() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allFiles.filter(f => 
                (f.title && f.title.toLowerCase().includes(query)) || 
                (f.category && f.category.toLowerCase().includes(query))
            );
            renderFiles(filtered);
        }

        async function handleFormSubmit(e) {
            e.preventDefault();
            const btn = document.getElementById('saveBtn');
            btn.disabled = true;
            btn.innerText = 'กำลังบันทึก...';

            const payload = {
                password: document.getElementById('adminPass').value,
                title: document.getElementById('fileTitle').value,
                category: document.getElementById('fileCategory').value,
                downloadUrl: document.getElementById('fileDownload').value,
                audioUrl: document.getElementById('fileAudio').value
            };

            try {
                const res = await fetch('/api/files', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();

                if (!res.ok) throw new Error(data.error || 'บันทึกไม่สำเร็จ');

                alert('เพิ่มรายการสำเร็จ!');
                closeAdminModal();
                document.getElementById('adminForm').reset();
                loadFiles();
            } catch (err) {
                alert(err.message);
            } finally {
                btn.disabled = false;
                btn.innerText = 'บันทึกข้อมูลเข้า FILE-NEXUS';
            }
        }

        async function deleteFile(id) {
            const pass = prompt('กรุณากรอกรหัสผ่าน Admin เพื่อยืนยันการลบ:');
            if (!pass) return;

            try {
                const res = await fetch('/api/files', {
                    method: 'DELETE',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id, password: pass })
                });
                if (!res.ok) throw new Error('รหัสผ่านไม่ถูกต้อง หรือเกิดข้อผิดพลาด');

                alert('ลบรายการสำเร็จ');
                loadFiles();
            } catch (err) {
                alert(err.message);
            }
        }

        function openAdminModal() { document.getElementById('adminModal').classList.remove('hidden'); }
        function closeAdminModal() { document.getElementById('adminModal').classList.add('hidden'); }
        function escapeHtml(str) { return (str || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }

        loadFiles();
    </script>
</body>
</html>
